name: Build MyStore APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          set -e

          mkdir -p extracted

          ARCHIVE=$(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: Project archive not found."
            exit 1
          fi

          echo "Found: $ARCHIVE"

          case "$ARCHIVE" in
            *.zip)
              unzip -q "$ARCHIVE" -d extracted
              ;;
            *.tar.gz|*.tgz)
              tar -xzf "$ARCHIVE" -C extracted
              ;;
          esac

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          set -e

          cd extracted

          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          set -e

          APK=$(find extracted -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"

          cp "$APK" MyStore.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStore-APK
          path: MyStore.apk
